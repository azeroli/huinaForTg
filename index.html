<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ComfyGen</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:     var(--tg-theme-bg-color,           #17212b);
  --bg2:    var(--tg-theme-secondary-bg-color,  #232e3c);
  --text:   var(--tg-theme-text-color,          #f5f5f5);
  --hint:   var(--tg-theme-hint-color,          #708499);
  --accent: var(--tg-theme-button-color,        #5288c1);
  --r: 16px;
}

html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}

.app {
  display: flex; flex-direction: column;
  height: 100%;
  padding: 10px 10px calc(env(safe-area-inset-bottom) + 68px);
  gap: 8px; overflow-y: auto;
}

/* ── Превью изображения ── */
.preview {
  flex-shrink: 0;
  border-radius: var(--r);
  background: var(--bg2);
  overflow: hidden;
  position: relative;
  /* портретный формат как в мокапе */
  aspect-ratio: 2/3;
  max-height: 44vh;
  display: flex; align-items: center; justify-content: center;
}

.preview img {
  width: 100%; height: 100%; object-fit: contain;
  position: absolute; inset: 0;
  opacity: 0; transition: opacity .4s;
}
.preview img.show { opacity: 1; }

.preview-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  color: var(--hint); font-size: 14px; text-align: center; padding: 20px;
  user-select: none; transition: opacity .3s;
}
.preview-placeholder .ico { font-size: 44px; opacity: .4; }

/* статус поверх превью */
.preview-status {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  border-radius: var(--r);
}
.preview-status.show { opacity: 1; }
.preview-status .s-icon { font-size: 42px; }
.preview-status .s-text { font-size: 15px; color: #fff; font-weight: 600; text-align: center; padding: 0 20px; }
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.2); border-top-color: #fff;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── История ── */
.history-wrap { flex-shrink: 0; }
.section-label {
  font-size: 11px; font-weight: 600; color: var(--hint);
  letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px;
}
.chips {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: var(--bg2); color: var(--text); border: none; border-radius: 20px;
  padding: 5px 12px; font-size: 12px; cursor: pointer; transition: opacity .15s, transform .1s;
}
.chip:active { opacity: .7; transform: scale(.95); }

/* ── Поля ── */
.fields { display: flex; flex-direction: column; gap: 7px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 11px; font-weight: 600; color: var(--hint); letter-spacing: .5px; text-transform: uppercase; }
.field textarea {
  background: var(--bg2); border: 1.5px solid transparent; border-radius: var(--r);
  padding: 10px 12px; color: var(--text); font-size: 15px; line-height: 1.4;
  resize: none; outline: none; font-family: inherit; transition: border-color .2s;
}
.field textarea:focus { border-color: var(--accent); }
.field textarea::placeholder { color: var(--hint); }
#prompt   { min-height: 72px; }
#negative { min-height: 54px; }
</style>
</head>
<body>
<div class="app">

  <!-- Превью -->
  <div class="preview" id="preview">
    <img id="last-img" alt="">
    <div class="preview-placeholder" id="placeholder">
      <div class="ico">🖼</div>
      <div>тут будет<br>итоговое изображение</div>
    </div>
    <div class="preview-status" id="status">
      <div class="s-icon" id="s-icon">⏳</div>
      <div class="s-text" id="s-text">Отправляю…</div>
    </div>
  </div>

  <!-- История -->
  <div class="history-wrap" id="history-wrap" style="display:none">
    <div class="section-label">🕐 Недавние</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- Поля -->
  <div class="fields">
    <div class="field">
      <div class="field-label">Промпт</div>
      <textarea id="prompt" placeholder="Опиши изображение…" rows="3"></textarea>
    </div>
    <div class="field">
      <div class="field-label">Негативный промпт</div>
      <textarea id="negative" placeholder="Что не должно быть…" rows="2"></textarea>
    </div>
  </div>

</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const promptEl   = document.getElementById('prompt');
const negEl      = document.getElementById('negative');
const statusEl   = document.getElementById('status');
const sIconEl    = document.getElementById('s-icon');
const sTextEl    = document.getElementById('s-text');
const lastImgEl  = document.getElementById('last-img');
const placeholder = document.getElementById('placeholder');
const histWrap   = document.getElementById('history-wrap');
const chipsEl    = document.getElementById('chips');

// ── последнее изображение из URL-параметра или localStorage ───────
function showLastImage(src) {
  if (!src) return;
  lastImgEl.src = src;
  lastImgEl.onload = () => {
    lastImgEl.classList.add('show');
    placeholder.style.opacity = '0';
  };
  localStorage.setItem('cg_last_img', src);
}

const params  = new URLSearchParams(window.location.search);
const imgParam = params.get('img');
showLastImage(imgParam || localStorage.getItem('cg_last_img'));

// ── История ───────────────────────────────────────────────────────
const HIST_KEY = 'cg_history';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
}
function saveHistory(pos, neg) {
  let h = loadHistory().filter(x => x.p !== pos);
  h.unshift({ p: pos, n: neg });
  localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 8)));
}
function renderHistory() {
  const h = loadHistory();
  if (!h.length) { histWrap.style.display = 'none'; return; }
  histWrap.style.display = '';
  chipsEl.innerHTML = '';
  h.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = item.p;
    btn.onclick = () => {
      promptEl.value = item.p;
      negEl.value    = item.n || '';
      promptEl.focus();
      tg?.HapticFeedback?.selectionChanged();
    };
    chipsEl.appendChild(btn);
  });
}
renderHistory();

// ── Telegram MainButton ───────────────────────────────────────────
if (tg) {
  tg.MainButton.setText('🎨 Начать генерацию');
  tg.MainButton.show();

  tg.MainButton.onClick(async () => {
    const positive = promptEl.value.trim();
    const negative = negEl.value.trim();
    if (!positive) { tg.showAlert('Введи промпт!'); return; }

    tg.MainButton.disable();
    tg.HapticFeedback?.impactOccurred('medium');

    // Показываем "Отправляю..."
    sIconEl.textContent = '';
    sIconEl.innerHTML = '<div class="spinner"></div>';
    sTextEl.textContent = 'Отправляю…';
    statusEl.classList.add('show');

    await sleep(600);

    saveHistory(positive, negative);
    renderHistory();

    // Показываем "Отправлено!"
    sIconEl.innerHTML = '✅';
    sTextEl.textContent = 'Отправлено!\nЖди результат в чате';

    await sleep(900);

    tg.sendData(JSON.stringify({ positive, negative }));
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
