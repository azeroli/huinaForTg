<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ComfyGen</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:     var(--tg-theme-bg-color,           #17212b);
  --bg2:    var(--tg-theme-secondary-bg-color,  #232e3c);
  --text:   var(--tg-theme-text-color,          #f5f5f5);
  --hint:   var(--tg-theme-hint-color,          #708499);
  --accent: var(--tg-theme-button-color,        #5288c1);
  --sep:    rgba(255,255,255,0.07);
  --r: 14px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 12px 12px calc(env(safe-area-inset-bottom) + 70px);
  gap: 10px;
  overflow-y: auto;
}

/* ── История ── */
.history-wrap { flex-shrink: 0; }

.section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--hint);
  letter-spacing: .5px;
  text-transform: uppercase;
  margin-bottom: 7px;
}

.chips {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  max-width: 180px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: var(--bg2);
  color: var(--text);
  border: none;
  border-radius: 20px;
  padding: 5px 13px;
  font-size: 12.5px;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.chip:active { opacity: .7; transform: scale(.96); }

/* ── Поля ввода ── */
.fields { display: flex; flex-direction: column; gap: 8px; flex: 1; }

.field { display: flex; flex-direction: column; gap: 5px; }

.field-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--hint);
  letter-spacing: .5px;
  text-transform: uppercase;
}

.field textarea {
  background: var(--bg2);
  border: 1.5px solid transparent;
  border-radius: var(--r);
  padding: 11px 13px;
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  resize: none;
  outline: none;
  font-family: inherit;
  transition: border-color .2s;
}
.field textarea:focus { border-color: var(--accent); }
.field textarea::placeholder { color: var(--hint); }

#prompt   { min-height: 100px; }
#negative { min-height: 70px; }

/* ── Счётчики символов ── */
.char-count {
  font-size: 11px;
  color: var(--hint);
  text-align: right;
  margin-top: -2px;
}

/* ── Статус отправки ── */
.status {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 76px);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(0,0,0,.85);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 9px 20px;
  border-radius: 24px;
  font-size: 14px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  z-index: 100;
}
.status.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <!-- История -->
  <div class="history-wrap" id="history-wrap" style="display:none">
    <div class="section-label">🕐 Недавние</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- Поля -->
  <div class="fields">
    <div class="field">
      <div class="field-label">Промпт</div>
      <textarea id="prompt" placeholder="Опиши изображение…" rows="4"></textarea>
      <div class="char-count"><span id="pc">0</span> симв.</div>
    </div>
    <div class="field">
      <div class="field-label">Негативный промпт</div>
      <textarea id="negative" placeholder="Что не должно быть на картинке…" rows="3"></textarea>
      <div class="char-count"><span id="nc">0</span> симв.</div>
    </div>
  </div>

</div>

<div class="status" id="status">✅ Отправлено! Жди результат в чате</div>

<script>
// ─── Telegram WebApp ───────────────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const promptEl   = document.getElementById('prompt');
const negativeEl = document.getElementById('negative');
const statusEl   = document.getElementById('status');
const histWrap   = document.getElementById('history-wrap');
const chipsEl    = document.getElementById('chips');

// ─── Счётчик символов ─────────────────────────────────────────────
promptEl.addEventListener('input', () => {
  document.getElementById('pc').textContent = promptEl.value.length;
});
negativeEl.addEventListener('input', () => {
  document.getElementById('nc').textContent = negativeEl.value.length;
});

// ─── История (localStorage) ───────────────────────────────────────
const HIST_KEY  = 'comfygen_history';
const MAX_HIST  = 8;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }
  catch { return []; }
}

function saveHistory(positive, negative) {
  let hist = loadHistory();
  const entry = { positive, negative };
  hist = hist.filter(h => h.positive !== positive);
  hist.unshift(entry);
  hist = hist.slice(0, MAX_HIST);
  localStorage.setItem(HIST_KEY, JSON.stringify(hist));
}

function renderHistory() {
  const hist = loadHistory();
  if (!hist.length) { histWrap.style.display = 'none'; return; }
  histWrap.style.display = '';
  chipsEl.innerHTML = '';
  hist.forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = h.positive;
    btn.title = `➕ ${h.positive}\n➖ ${h.negative || '—'}`;
    btn.onclick = () => {
      promptEl.value   = h.positive;
      negativeEl.value = h.negative || '';
      document.getElementById('pc').textContent = promptEl.value.length;
      document.getElementById('nc').textContent = negativeEl.value.length;
      promptEl.focus();
      tg?.HapticFeedback?.selectionChanged();
    };
    chipsEl.appendChild(btn);
  });
}

renderHistory();

// ─── Telegram Main Button ─────────────────────────────────────────
if (tg) {
  tg.MainButton.setText('🎨 Начать генерацию');
  tg.MainButton.show();

  tg.MainButton.onClick(() => {
    const positive = promptEl.value.trim();
    const negative = negativeEl.value.trim();

    if (!positive) {
      tg.showAlert('Введи промпт!');
      return;
    }

    saveHistory(positive, negative);
    tg.HapticFeedback?.notificationOccurred('success');

    // показываем статус на секунду перед закрытием
    statusEl.classList.add('show');
    setTimeout(() => {
      tg.sendData(JSON.stringify({ positive, negative }));
    }, 600);
  });
}
</script>
</body>
</html>
